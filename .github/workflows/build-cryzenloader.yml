          CRYZENLOADER_B64
      - name: Buka arsip project
        run: tar xzf project.tgz
      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Unit test (tidak memblokir APK)
        id: unittest
        continue-on-error: true
        run: gradle test --continue --stacktrace
        working-directory: cryzen-loader
      - name: Build APK debug
        run: gradle assembleDebug --stacktrace
        working-directory: cryzen-loader
      - uses: actions/upload-artifact@v4
        with:
          name: CryzenLoader-apk
          path: cryzen-loader/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: cryzen-loader/**/build/reports/tests/**
